          color: #b7c8df;
        }

        .markdown-section ul {
          padding-left: 0.95rem;
        }

        .markdown-section li {
          line-height: 1.62;
        }

        .markdown-section h2 + ul > li,
        .markdown-section h2 + p + ul > li {
          margin: 7px 0;
          padding: 0;
          border: 0;
          background: transparent;
          box-shadow: none;
          transform: none;
        }

        .markdown-section h2 + ul > li:hover,
        .markdown-section h2 + p + ul > li:hover {
          border: 0;
          background: transparent;
          box-shadow: none;
          transform: none;
        }

        .markdown-section h2 + ul > li::marker,
        .markdown-section h2 + p + ul > li::marker {
          content: initial;
        }

        .markdown-section a {
          color: #7dd3fc;
          overflow-wrap: anywhere;
          text-shadow: none;
        }

        .markdown-section blockquote {
          margin: 18px 0;
          padding: 12px 14px;
          border: 0;
          border-left: 3px solid var(--green);
          background: rgba(40, 247, 161, 0.075);
          box-shadow: none;
        }

        .markdown-section blockquote::before {
          display: none;
        }

        .markdown-section table {
          display: block;
          max-width: 100%;
          overflow-x: auto;
          white-space: nowrap;
          -webkit-overflow-scrolling: touch;
        }

        .markdown-section pre {
          max-width: 100%;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }

        .markdown-section code {
          border: 0;
          background: rgba(125, 211, 252, 0.11);
          word-break: break-word;
        }

        .sidebar-toggle {
          min-width: 48px;
          min-height: 48px;
          left: 14px;
          bottom: calc(14px + env(safe-area-inset-bottom));
          display: grid;
          place-content: center;
        }

        .github-corner {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .markdown-section {
          padding-left: 16px;
          padding-right: 16px;
        }

        .markdown-section h1 {
          font-size: 28px;
        }

        .markdown-section h2 {
          font-size: 20px;
        }

        .markdown-section h2 + ul > li,
        .markdown-section h2 + p + ul > li {
          margin-left: 0;
          margin-right: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }

        body::after,
        .boot-bar::after {
          animation: none !important;
        }
      }
    </style>
